<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8d8ff">
<title>우리 집 자원·에너지 탐험</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<button id="btnGo" class="hud-btn" type="button">바로 가기</button>
<button id="btnRec" class="hud-btn" type="button">내가 살펴본 곳<span id="recCount">0</span></button>
<div id="chips">
  <div id="chipHint" class="chip" hidden>빗물통(초록 표식)으로 걸어가 보세요</div>
  <div id="chipFree" class="chip chip-free" hidden>자원을 아끼는 곳도 한 군데 찾아보세요</div>
</div>
<div id="prompt" hidden><span id="promptName"></span><button id="promptBtn" type="button">살펴보기</button></div>
<div id="joy"><div id="joyKnob"></div></div>

<aside id="panel" hidden>
  <div class="p-head"><div id="pPlace" class="p-place"></div><div id="pName" class="p-name"></div></div>
  <div id="pBodies" class="p-bodies"></div>
  <button id="pBack" class="p-back" type="button">탐험으로 돌아가기</button>
</aside>
<div id="modelLabel" hidden>원리를 보여 주는 모형</div>
<div id="toast" hidden></div>

<div id="modal" hidden>
  <div class="m-box">
    <div class="m-head"><span id="mTitle"></span><button id="mClose" type="button">닫기</button></div>
    <div id="mBody"></div>
  </div>
</div>

<div id="start">
  <div class="s-card">
    <h1>우리 집 자원·에너지 탐험</h1>
    <p class="s-sub"><b class="res">자원</b>과 <b class="en">에너지</b>를 아끼는 곳을 찾아 직접 움직여 봐요</p>
    <div class="s-steps">
      <div class="s-step" data-n="1"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="#e9f3ff" stroke="#2b2b2b" stroke-width="3"/><circle cx="28" cy="20" r="9" fill="#fff" stroke="#2b2b2b" stroke-width="3"/><path d="M28 34v10M23 39l5 5 5-5" stroke="#2b2b2b" stroke-width="3" fill="none"/></svg>왼손으로<br>끌어서 걷기</div>
      <div class="s-step" data-n="2"><svg viewBox="0 0 56 56"><path d="M10 28a18 12 0 0 1 36 0" stroke="#2b2b2b" stroke-width="3" fill="none"/><path d="M40 20l6 8-9 2" stroke="#2b2b2b" stroke-width="3" fill="none"/><circle cx="28" cy="38" r="7" fill="#ffd34d" stroke="#2b2b2b" stroke-width="3"/></svg>오른손으로<br>끌어서 둘러보기</div>
      <div class="s-step" data-n="3"><svg viewBox="0 0 56 56"><path d="M16 5l9 9-9 9-9-9z" fill="#1f9e45" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/><path d="M40 2l7 12-7 12-7-12z" fill="#e67a00" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/><rect x="8" y="34" width="40" height="16" rx="5" fill="#ffd34d" stroke="#2b2b2b" stroke-width="3"/></svg>표식에 다가가<br>‘살펴보기’ 누르기</div>
      <div class="s-step" data-n="4"><svg viewBox="0 0 56 56"><rect x="6" y="12" width="44" height="32" rx="7" fill="#ffe27a" stroke="#2b2b2b" stroke-width="3"/><path d="M18 28h18M30 21l7 7-7 7" stroke="#2b2b2b" stroke-width="3" fill="none"/></svg>‘바로 가기’로<br>한 번에 이동</div>
    </div>
    <button id="startBtn" type="button">탐험 시작</button>
  </div>
</div>
<div id="rotate">태블릿을 가로로 돌려 주세요</div>

<script src="vendor/three.min.js"></script>
<script src="js/core/blocks.js"></script>
<script src="js/core/viz.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/core/app.js"></script>
<!-- 시설: 파일 하나 = 시설 하나 (계약은 ARCHITECTURE.md) -->
<script src="js/facilities/rainbarrel.js"></script>
<script src="js/facilities/chair.js"></script>
<script src="js/facilities/can.js"></script>
<script src="js/facilities/lighting.js"></script>
<script src="js/facilities/insulation.js"></script>
<script src="js/facilities/shade.js"></script>
<script src="js/facilities/roofgarden.js"></script>
<script src="js/facilities/heatexchanger.js"></script>
<script src="js/facilities/solar.js"></script>
<script src="js/facilities/geothermal.js"></script>
<script>EXP.boot();</script>
</body>
</html>
